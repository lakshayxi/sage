[project]
name = "sage"
version = "0.1.0"
description = "Sage — an AI-native financial research workspace (backend/CLI core)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20.0",
    "pymupdf>=1.28.2",
    "chromadb>=0.5",
    "sqlalchemy>=2.0.52",
    "rank-bm25>=0.2",
    "sentence-transformers>=6.0.0",
    # >=0.138 for app.frontend() (api/main.py) -- shipped in FastAPI 0.138.0
    # (2026-06-20); anything older doesn't have this method at all and fails
    # at import time with AttributeError, not a graceful degradation.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.5",
    "fpdf2>=2.8.8",
    "huggingface_hub>=1.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
sage = "sage.cli:main"
sage-eval = "eval.run_eval:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sage*", "config*", "eval*"]
